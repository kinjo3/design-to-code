name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "test/*.test.mjs" "test/modules/*.test.mjs"
      # GitHub のランナーには Chrome が入っているので、e2e のテストの前に Chrome を入れる手順は置かない
      - run: npm ci --prefix plugin
      - run: node --test "test/e2e/*.test.mjs"
