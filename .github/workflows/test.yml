name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # 利用者の多い macOS と、リンクの扱いが違い得る Linux の両方で、読み書きの守りを確かめる
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "test/*.test.mjs"
      # design-diff を実際に動かすテストは、plugin の依存と Chrome が要る。GitHub のランナーには Chrome が入っている
      - run: npm ci --prefix plugin
      - run: node --test "test/e2e/*.test.mjs"
